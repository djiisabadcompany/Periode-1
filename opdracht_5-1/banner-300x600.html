<body>

                <h2 class="sub-title">Internet + bellen.</h2>

                <div class="sim-wrapper">
                    <img src="simKaart.png" alt="Simkaart" class="sim-img1">
                </div>

                <ul class="list">
                    <li>+ Onbeperkt data</li>
                    <li>+ 39,95/mnd</li>
                    <li>+ Snelheid tot 1Gbit/s</li>
                </ul>
            </div>
        </div>
        <div class="bottom-ballsack1">
            <a href="#" class="bottom-button3">Ontdek meer</a>
        </div>
    </div>

</body>

</html>
