<!DOCTYPE html>
<html lang="nl">

        <div class="banner-body1">

            </div>

            <div class="banner-col col-media">
                <div class="sim-wrapper">
                    <img src="simKaart.png" alt="Simkaart" class="sim-im2">
                </div>
            </div>

            <div class="banner-col col-list">
                <ul class="list2">
                    <li>+ Onbeperkt data</li>
                    <li>+ 39,95/mnd</li>
                    <li>+ Snelheid tot 1Gbit/s</li>
                </ul>
            </div>
